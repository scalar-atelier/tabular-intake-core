name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Derive release version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Verify npm trusted-publishing runtime
        run: |
          node - <<'JS'
          const { execFileSync } = require('node:child_process');
          const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            throw new Error('npm 11.5.1+ is required for OIDC trusted publishing');
          }
          JS
      - name: Verify release versions
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          assert tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"] == os.environ["RELEASE_VERSION"]
          PY
          node -e "if (require('./package.json').version !== process.env.RELEASE_VERSION) process.exit(1)"
      - run: python -m pip install build
      - run: npm ci
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: npm test
      - run: python -m build
        env:
          SOURCE_DATE_EPOCH: "315532800"
      - name: Build release assets once
        env:
          SOURCE_TAG: ${{ github.ref_name }}
        run: |
          npm run build:demo
          npm pack
          (cd demo-dist && zip -qr "../tabular-intake-demo-v${RELEASE_VERSION}.zip" .)
          sha256sum dist/* "scalar-atelier-tabular-intake-core-${RELEASE_VERSION}.tgz" "tabular-intake-demo-v${RELEASE_VERSION}.zip" > SHA256SUMS
      - name: Smoke install built artifacts
        run: |
          python -m venv /tmp/tabular-intake-release
          /tmp/tabular-intake-release/bin/pip install "dist/scalar_tabular_intake-${RELEASE_VERSION}-py3-none-any.whl"
          /tmp/tabular-intake-release/bin/scalar-tabular-intake --help
          mkdir /tmp/tabular-intake-npm
          npm install --prefix /tmp/tabular-intake-npm "./scalar-atelier-tabular-intake-core-${RELEASE_VERSION}.tgz"
          /tmp/tabular-intake-npm/node_modules/.bin/scalar-tabular-intake 2>&1 | grep -q '^usage:'
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --draft --title "tabular-intake-core $GITHUB_REF_NAME"
          --notes "Python, Node.js, and install-free browser release. Distribution ${RELEASE_VERSION} preserves deterministic core contract 0.1.0."
          dist/* "scalar-atelier-tabular-intake-core-${RELEASE_VERSION}.tgz" "tabular-intake-demo-v${RELEASE_VERSION}.zip" SHA256SUMS
      - name: Publish Python package
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish npm package
        run: npm publish "./scalar-atelier-tabular-intake-core-${RELEASE_VERSION}.tgz" --access public
      - name: Verify registry artifacts
        run: |
          mkdir /tmp/tabular-intake-readback
          for attempt in $(seq 1 12); do
            if python -m pip download --no-cache-dir --no-deps --only-binary=:all: \
                 --dest /tmp/tabular-intake-readback "scalar-tabular-intake==${RELEASE_VERSION}" \
               && python -m pip download --no-cache-dir --no-deps --no-binary=:all: \
                 --dest /tmp/tabular-intake-readback "scalar-tabular-intake==${RELEASE_VERSION}"; then
              break
            fi
            [ "$attempt" -eq 12 ] && exit 1
            sleep 10
          done
          for attempt in $(seq 1 12); do
            npm pack "@scalar-atelier/tabular-intake-core@${RELEASE_VERSION}" --pack-destination /tmp/tabular-intake-readback && break
            [ "$attempt" -eq 12 ] && exit 1
            sleep 10
          done
          cmp "dist/scalar_tabular_intake-${RELEASE_VERSION}-py3-none-any.whl" "/tmp/tabular-intake-readback/scalar_tabular_intake-${RELEASE_VERSION}-py3-none-any.whl"
          cmp "dist/scalar_tabular_intake-${RELEASE_VERSION}.tar.gz" "/tmp/tabular-intake-readback/scalar_tabular_intake-${RELEASE_VERSION}.tar.gz"
          cmp "scalar-atelier-tabular-intake-core-${RELEASE_VERSION}.tgz" "/tmp/tabular-intake-readback/scalar-atelier-tabular-intake-core-${RELEASE_VERSION}.tgz"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
